[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-pr"
version = "0.1.0"
description = "Autonomous Code Reviewer & PR Quality Gate with AST diff slicing, anti-bloat auditing, and sandbox verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SentinelPR Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
