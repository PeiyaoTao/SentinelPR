name: SentinelPR Auto Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: sentinel-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Reviewer code and its dependencies come from the trusted base revision.
      # The PR checkout is data only; tests/builds run in offline containers.
      - name: Check out trusted reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reviewer
          persist-credentials: false

      - name: Check out exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trusted reviewer
        run: |
          python -m pip install -r reviewer/requirements-audit.txt
          python -m pip install --no-deps ./reviewer

      - name: Prepare trusted offline check environment
        run: docker build -f reviewer/Dockerfile.checks -t sentinel-checks:local reviewer

      - name: Run review and project validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTINEL_TARGET_PATH: target
          SENTINEL_REPORT_DIR: sentinel-artifacts
          SENTINEL_CHECKS: all
          SENTINEL_CHECK_IMAGE: sentinel-checks:local
          SENTINEL_PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          SENTINEL_LLM_PROVIDER: ${{ vars.SENTINEL_LLM_PROVIDER || 'heuristics' }}
          SENTINEL_LLM_CRITIC: ${{ vars.SENTINEL_LLM_CRITIC || 'true' }}
          SENTINEL_BASE_URL: ${{ vars.SENTINEL_BASE_URL || '' }}
          FAST_MODEL: ${{ vars.FAST_MODEL || '' }}
          FRONTIER_MODEL: ${{ vars.FRONTIER_MODEL || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m sentinel.github

      - name: Archive review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-pr-review
          path: sentinel-artifacts/
          if-no-files-found: warn
