name: SentinelPR Repository Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SentinelPR
        run: |
          python -m pip install -r requirements-audit.txt
          python -m pip install --no-deps .

      - name: Prepare offline check environment
        run: docker build -f Dockerfile.checks -t sentinel-checks:local .

      - name: Run SentinelPR Repository Review
        env:
          SENTINEL_LLM_PROVIDER: ${{ vars.SENTINEL_LLM_PROVIDER || secrets.SENTINEL_LLM_PROVIDER || '' }}
          SENTINEL_LLM_CRITIC: ${{ vars.SENTINEL_LLM_CRITIC || 'true' }}
          SENTINEL_LLM_QUALITY: ${{ vars.SENTINEL_LLM_QUALITY || 'true' }}
          SENTINEL_LLM_TIMEOUT_SECONDS: ${{ vars.SENTINEL_LLM_TIMEOUT_SECONDS || '180' }}
          SENTINEL_LLM_REVIEW_SECONDS: ${{ vars.SENTINEL_LLM_REVIEW_SECONDS || '600' }}
          SENTINEL_LLM_MAX_OUTPUT_TOKENS: ${{ vars.SENTINEL_LLM_MAX_OUTPUT_TOKENS || '8192' }}
          SENTINEL_LLM_REVIEW_OUTPUT_TOKENS: ${{ vars.SENTINEL_LLM_REVIEW_OUTPUT_TOKENS || '65536' }}
          SENTINEL_QUALITY_MAX_GROUPS: ${{ vars.SENTINEL_QUALITY_MAX_GROUPS || '5' }}
          SENTINEL_QUALITY_CONTEXT_CHARS: ${{ vars.SENTINEL_QUALITY_CONTEXT_CHARS || '18000' }}
          SENTINEL_BASE_URL: ${{ vars.SENTINEL_BASE_URL || secrets.SENTINEL_BASE_URL || '' }}
          FAST_MODEL: ${{ vars.FAST_MODEL || secrets.FAST_MODEL || '' }}
          FRONTIER_MODEL: ${{ vars.FRONTIER_MODEL || secrets.FRONTIER_MODEL || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m sentinel.cli --repo . --checks all --markdown repo-review.md --sarif repo-review.sarif

      - name: Publish Review to GitHub Job Summary
        if: always()
        run: |
          if [ -f repo-review.md ]; then
            cat repo-review.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: repo-review.sarif

      - name: Archive Review Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinelpr-repo-review
          path: |
            repo-review.md
            repo-review.sarif
